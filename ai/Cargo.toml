[package]
name = "ai"
version = "0.1.0"
edition = "2024"


[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.12", features = ["json"] }

base64 = "0.22.1"
ai-derive = { path = "../ai-derive", optional = true }

[features]
default = ["derive"]  # Enable derive by default
derive = ["ai-derive"]  # Feature that pulls in the macro
