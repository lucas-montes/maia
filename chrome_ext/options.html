<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Maia Settings</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { width: 420px; text-align: left; }
    label { display: block; margin: 12px 0 4px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    #status { margin-top: 12px; min-height: 1.2em; }
    .ok { color: #1a7f37; }
    .error { color: #c62828; }
  </style>
</head>
<body>
  <h1>Maia Settings</h1>
  <p>Connect this extension to your Maia sync-server.</p>
  <label for="baseUrl">Server base URL</label>
  <input id="baseUrl" type="text" placeholder="http://localhost:3030" />
  <label for="apiKey">API key</label>
  <input id="apiKey" type="password" placeholder="same key the server/desktop app uses" />
  <button id="save">Save</button>
  <p id="status"></p>
  <script src="options.js"></script>
</body>
</html>
