[package]
name = "maia"
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
clap = { version = "4.5.40", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
tracing-appender = "0.2"

[dependencies]
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
ai = { path = "ai", features = ["cli"] }
todo = { path = "todo", features = ["cli"] }
finance = { path = "finance", features = ["cli"] }
food = { path = "food", features = ["cli"] }
knowledge = { path = "knowledge", features = ["cli"] }

[workspace]
members = ["todo", "daemon", "ai", "finance", "food", "knowledge"]
