[package]
name = "maia"
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
clap = { version = "4.5.40", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.46.1", features = ["macros", "rt", "net", "io-util", "rt-multi-thread", "fs", "signal"] }

ai = { path = "ai" }
knowledge = { path = "knowledge" }
shared = { path = "shared" }
finances = { path = "finances" }
health = { path = "health" }

[dependencies]

[workspace]
members = ["ai", "maia-ui/src-tauri", "sync-server"]
